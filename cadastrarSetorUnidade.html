    <h1>Cadastro de unidade e setores</h1>
    <div class="container">
        <form action="" method="get">
            <div class="form-group">
                <label for="nome">Nome da unidade:</label>
                <input type="text" name="nome" placeholder="Informe o nome da unidade" >
            </div> <div class="form-group">
                <label for="nome">Sigla da unidade:</label>
                <input type="text" name="sigla" placeholder="Informe a sigla da unidade" >
            </div>
            <div class="form-group">
                <label for="">Quantidade de setores:</label>
                <input type="text" name="quant" placeholder="Informe a quantidade" >
            </div>
            <div class="form-group">
                <label for="">Nome do setor:</label>
                <input type="text" name="nsetor" placeholder="Informe o nome do setor" required>
            </div>
            <br>
            <div class="form-group">
                <label for="">Nome do gestor:</label>
                <input type="text" name="gest" required placeholder="Informe o nome do gestor" >
            </div>
            <div class="form-group">
                <label for="">Data de inicio:</label>
                <input type="date" name="gest" required placeholder="Informe a data de inicio">
            </div>
            <div class="form-group">
                <label for="">Data fim:</label>
                <input type="date" name="gest" required placeholder="Informe a data de fim">
            </div>
            <div class="form-grou_btn">
                <p>
                    <br><br><br>
                    <button type="submit">Cadastrar setor</button>
                </p>
            </div>
        </form>

    </div>
