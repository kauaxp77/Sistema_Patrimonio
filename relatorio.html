    <h1>Gerador de Relatórios</h1>

    <form id="reportOptions">
        <label for="reportType">Tipo de Relatório:</label>
        <select id="reportType">
            <option value="relatorio1">Inventario</option>
            <option value="relatorio2">Relatar defeito</option>
            <option value="relatorio3"></option>
        </select>

        <label for="startDate">Data de Início:</label>
        <input type="date" id="startDate">

        <label for="endDate">Data de Término:</label>
        <input type="date" id="endDate">

        <label for="format">Formato do Relatório:</label>
        <select id="format">
            <option value="pdf">PDF</option>
            <option value="excel">Excel</option>
        </select>

        <label for="comment">Comentários adicionais:</label>
        <textarea id="comment" placeholder="" rows="4" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;"></textarea>

        <button type="button" id="generateReport">Gerar Relatório</button>
    </form>

    <script>
        // Função para gerar o relatório com base nas opções selecionadas
        document.getElementById("generateReport").addEventListener("click", function () {
            const reportType = document.getElementById("reportType").value;
            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;
            const format = document.getElementById("format").value;

            // Aqui você pode inserir a lógica para gerar o relatório com base nas opções selecionadas
            // Vou criar um exemplo simples apenas para ilustração:
            const reportResult = `Relatório ${reportType} do período de ${startDate} a ${endDate} gerado no formato ${format}.`;

            // Exibir o resultado na página
            document.getElementById("reportResult").innerHTML = reportResult;
        });
    </script>
