<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500&display=swap" rel="stylesheet">
    <link href=".../css/boot.css" rel="stylesheet">
    <link href=".../css/style.css" rel="stylesheet">
    <link rel="stylesheet" href=".../css/formulario.css">
    <title>PROJETO HTML MOD 3</title>
</head>

<body>
    <!-- DOBRA CABEÇALHO -->

    <header class="main_header">
        <div class="main_header_content">
            <a href="#" class="logo">
                <img src=".../img/logo.png" alt="Bem vindo ao projeto prático Html5 e Css3 Essentials"
                    title="Bem vindo ao projeto prático Html5 e Css3 Essentials"></a>

            <nav class="main_header_content_menu">
                <ul>
                    <li><a href=".../view/opcao.html">Voltar</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <!-- FIM DOBRA CABEÇALHO -->
    <h1>Editar Cadastro</h1>
    <div class="container">
        <form action="" method="get">
            <div class="form-group">
                <label for="Tombamento">Tombo:</label>
                <input type="text" name="nome" placeholder="Informe o tombamento" required>
            </div>
            <div class "form-group">
                <label for="Codigo">Codigo RFID:</label>
                <input type="text" name="RFID" placeholder="Informe o codigo RFID" required>
            </div>
            <div class="form-group">
                <label for="Tombo">Tombo limpo:</label>
                <input type="text" name="Tombo limpo" placeholder="Informe o tombo limpo" required>
            </div>
            <div class="form-group">
                <label for="Especificaçao">Especificaçao de bem:</label>
                <input type="text" name="Espec" required placeholder="De uma Especificaçao sobre esse bem">
            </div>
            <div class="form-group">
                <label for="Valor">Valor do bem:</label>
                <input type="text" name="valor" required placeholder="Informe o valor do bem">
            </div>
            <div class="form-group">
               <label for="situacao">Situação do bem:</label>
                <select name="" id="">
                    <option value="">Ativo</option>
                    <option value="">Inativo</option>
                    <option value="">Ocioso</option>
                    <option value="">Recuperado</option>
                </select>
            </div>
            <div class="form-group">
                <label for="data de cadastro">Data de cadastro:</label>
                <input type="date" name="data" required>
            </div>
            <div class="form-group">
                <label for="senha">Data de baixa:</label>
                <input type="date" name="data" required>
            </div>
            <div class="form-group">
                <label for="origbem">Motivo da baixa:</label>
                <input type="text" name="origbem" required>
            </div>
            <div class="form-group">
                <label for="origbem">Origem do bem:</label>
                <input type="text" name="origbem" required>
            </div>
            <div class="form-group">
                <label for="ftbem">Foto do bem:</label>
                <input type="file" name="ftbem" required>
            </div>
            <div class="form-grou_btn">
                <p>
                    <br><br><br>
                    <button type="submit">Editar</button>
                </p>
            </div>
        </form>
    </div>
</body>

</html>
